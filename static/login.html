<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — PyUp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f7f7f4; --ink:#0f0f0f; --muted:#8a8a80; --accent:#e8420e; --line:#e9e9e4; --card:#fff; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:"DM Sans",sans-serif; color:var(--ink); background:var(--bg); }
  a { color:inherit; }
  .shell { min-height:100vh; display:grid; grid-template-columns: 1.05fr 0.95fr; }
  .panel {
    background:var(--ink); color:#fff; padding:36px 48px;
    display:flex; flex-direction:column; justify-content:space-between;
    position:relative; overflow:hidden;
  }
  .panel::before {
    content:""; position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(ellipse 70% 55% at 80% 10%, rgba(232,66,14,.45), transparent 60%),
      radial-gradient(ellipse 50% 40% at 10% 90%, rgba(232,66,14,.18), transparent 55%);
  }
  .panel > * { position:relative; }
  .logo { font-family:Syne,sans-serif; font-weight:800; font-size:1.35rem; letter-spacing:-.4px; text-decoration:none; }
  .logo b { color:var(--accent); }
  .panel h1 { font-family:Syne,sans-serif; font-weight:800; font-size:clamp(2.6rem,5vw,4.2rem); line-height:.95; letter-spacing:-1.8px; margin:0 0 16px; }
  .panel p { margin:0; max-width:26rem; color:rgba(255,255,255,.62); font-size:1.05rem; }
  .steps { display:flex; gap:18px; margin-top:28px; color:rgba(255,255,255,.72); font-size:.84rem; }
  .steps span { display:block; font-family:Syne,sans-serif; color:#fff; font-size:1.05rem; margin-bottom:2px; }
  .form-side { display:flex; align-items:center; justify-content:center; padding:32px 24px; }
  form { width:min(400px, 100%); }
  .eyebrow { font-size:.75rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin:0 0 8px; }
  form h2 { font-family:Syne,sans-serif; font-size:2rem; letter-spacing:-.8px; margin:0 0 6px; }
  .sub { color:var(--muted); margin:0 0 26px; }
  label { display:block; font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 0 6px; }
  input {
    width:100%; padding:13px 14px; border:1.5px solid var(--line); border-radius:12px;
    background:var(--card); font:inherit; font-size:1rem; color:var(--ink); outline:none; margin-bottom:14px;
  }
  input:focus { border-color:var(--accent); }
  button {
    width:100%; margin-top:6px; border:0; border-radius:999px; padding:14px 18px;
    background:var(--ink); color:#fff; font:inherit; font-weight:700; cursor:pointer;
  }
  button:hover { background:var(--accent); }
  .err { display:none; background:#fff1f0; color:#b91c1c; border-radius:12px; padding:10px 12px; font-size:.88rem; margin-bottom:14px; }
  .foot { margin-top:18px; text-align:center; color:var(--muted); font-size:.92rem; }
  .foot a { color:var(--accent); font-weight:700; text-decoration:none; }
  .back { display:inline-block; margin-top:18px; color:var(--muted); font-size:.88rem; text-decoration:none; }
  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
    .panel { min-height:auto; padding:28px 22px 32px; }
    .panel h1 { font-size:2.4rem; }
    .steps { display:none; }
  }
</style>
</head>
<body>
<div class="shell">
  <section class="panel">
    <a class="logo" href="../index.html">Py<b>Up</b></a>
    <div>
      <h1>Welcome back.</h1>
      <p>Sign in to see orders, menus, and the stores you run.</p>
      <div class="steps">
        <div><span>01</span>Scan the table</div>
        <div><span>02</span>Send the order</div>
        <div><span>03</span>Kitchen gets it</div>
      </div>
    </div>
    <div></div>
  </section>
  <section class="form-side">
    <form onsubmit="login(); return false;">
      <p class="eyebrow">Staff and owners</p>
      <h2>Sign in</h2>
      <p class="sub">Use the username from your account.</p>
      <div id="loginError" class="err"></div>
      <label for="username">Username</label>
      <input id="username" autocomplete="username" placeholder="Your username">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Your password">
      <button id="loginBtn" type="submit">Sign in</button>
      <p class="foot">No account yet? <a href="register.html">Create one</a></p>
      <a class="back" href="../index.html">← Back to PyUp</a>
    </form>
  </section>
</div>
<script src="config.js"></script>
<script src="script.js"></script>
<script>
async function login() {
  const err = document.getElementById("loginError");
  const btn = document.getElementById("loginBtn");
  err.style.display = "none";
  btn.disabled = true;
  try {
    const res = await fetch(`${API}/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value
      })
    });
    const data = await res.json();
    if (res.ok) {
      saveToken(data.access_token, data.role, data.user_id);
      window.location.href = data.role === "admin" ? "admin.html" : "dashboard.html";
      return;
    }
    err.textContent = data.detail || "Login failed";
    err.style.display = "block";
  } catch (e) {
    err.textContent = "Could not reach the server.";
    err.style.display = "block";
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
