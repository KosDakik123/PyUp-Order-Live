<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — PyUp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lofi.css">
<style>
  :root { --ink:#141018; --muted:#6f6a74; --accent:#e8420e; --line:#eadfd4; --card:#fffaf6; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:"DM Sans",sans-serif; color:var(--ink); background:#24183f; }
  a { color:inherit; }
  .dash-sky .vinyl { display: none; }
  .dash-sky .moon { left: auto; right: 7%; top: 28px; width: 72px; height: 72px; }
  .wrap { position: relative; z-index: 1; max-width: 1080px; margin: 28px auto 56px; padding: 0 20px; }
  header {
    display:flex; align-items:center; gap:16px; margin-bottom:18px; color:#fff;
  }
  .logo { font-family:Syne,sans-serif; font-weight:800; font-size:1.35rem; letter-spacing:-.4px; text-decoration:none; }
  .logo b { color:#ffb199; }
  .crumb { margin:0; opacity:.8; font-size:.95rem; }
  .actions { margin-left:auto; display:flex; gap:8px; }
  .btn {
    border-radius:999px; padding:9px 14px; font:inherit; font-weight:700; font-size:.88rem;
    text-decoration:none; border:1.5px solid rgba(255,255,255,.35); background:transparent; color:#fff; cursor:pointer;
  }
  .btn.solid { background:#fff; color:var(--ink); border-color:#fff; }
  .btn:hover { background:var(--accent); border-color:var(--accent); color:#fff; }
  section {
    background: #fffaf6;
    border:1px solid rgba(255,255,255,.4);
    border-radius:22px;
    padding:22px 22px 18px;
    margin-bottom:16px;
    box-shadow: 0 18px 50px rgba(20,10,30,.22);
  }
  .sec-head { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin-bottom:16px; }
  h1 { font-family:Syne,sans-serif; font-size:1.45rem; letter-spacing:-.5px; margin:0; }
  .sec-head p { margin:0; color:var(--muted); font-size:.92rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
  .tile {
    background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px;
    display:flex; flex-direction:column; gap:8px; min-height:160px;
  }
  .tile img { width:100%; height:140px; object-fit:cover; border-radius:12px; }
  .tile h2 { font-family:Syne,sans-serif; font-size:1.05rem; letter-spacing:-.3px; margin:0; }
  .tile p { margin:0; color:var(--muted); font-size:.9rem; line-height:1.4; flex:1; }
  .tile small { color:var(--muted); }
  .tile a, .meta { margin-top:auto; }
  .tile a {
    align-self:flex-start; text-decoration:none; font-weight:700; font-size:.86rem;
    background:var(--ink); color:#fff; border-radius:999px; padding:7px 12px;
  }
  .tile a:hover { background:var(--accent); }
  .meta { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .meta strong { font-family:Syne,sans-serif; }
  .meta small { color:var(--muted); }
  .empty { color:var(--muted); margin:0; padding:8px 0; }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.92rem; }
  th { text-align:left; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:0 10px 10px; }
  td { padding:12px 10px; border-top:1px solid var(--line); vertical-align:middle; }
  .pill { display:inline-block; border-radius:999px; padding:3px 9px; font-size:.75rem; font-weight:700; }
  .pill.ok { background:#e7f6ec; color:#166534; }
  .pill.wait { background:#fff1df; color:#9a5416; }
  @media (max-width: 720px) {
    header { flex-wrap:wrap; }
    .actions { width:100%; }
    .sec-head { flex-direction:column; align-items:flex-start; }
  }
</style>
</head>
<body>
<div class="lofi-bg dash-sky" aria-hidden="true">
  <div class="moon"></div>
  <div class="skyline">
    <i style="height:42%"></i><i style="height:70%"></i><i style="height:50%"></i>
    <i style="height:84%"></i><i style="height:58%"></i><i style="height:74%"></i>
    <i style="height:40%"></i><i style="height:64%"></i>
  </div>
  <div class="rain"></div>
  <div class="grain"></div>
</div>
<div class="wrap">
  <header>
    <a class="logo" href="../index.html">Py<b>Up</b></a>
    <p class="crumb">Dashboard</p>
    <div class="actions">
      <a class="btn" href="my-store.html">My store</a>
      <button class="btn solid" type="button" onclick="logout()">Sign out</button>
    </div>
  </header>

  <section>
    <div class="sec-head">
      <h1>Stores</h1>
      <p>Places open for orders.</p>
    </div>
    <div id="stores" class="grid"></div>
  </section>

  <section>
    <div class="sec-head">
      <h1>Menu</h1>
      <p>Items across every store.</p>
    </div>
    <div id="services" class="grid"></div>
  </section>

  <section>
    <div class="sec-head">
      <h1>Your orders</h1>
      <p>What you have already sent.</p>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Order</th>
            <th>Store</th>
            <th>Item</th>
            <th>Price</th>
            <th>Status</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="orders"></tbody>
      </table>
    </div>
  </section>
</div>
<script src="config.js"></script>
<script src="script.js"></script>
<script>
checkAuth("user")
loadStores()
loadAllServices()
loadMyOrders()
</script>
</body>
</html>
