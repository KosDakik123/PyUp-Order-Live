<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PyUp — Delivery jobs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f7f7f4; --ink:#0f0f0f; --muted:#8a8a80; --accent:#e8420e; --card:#fff; --line:#e9e9e4; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"DM Sans",sans-serif; background:var(--bg); color:var(--ink); }
  a { color:inherit; text-decoration:none; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; position:sticky; top:0; background:rgba(247,247,244,.94); backdrop-filter:blur(16px); }
  .logo { font-family:Syne,sans-serif; font-weight:800; font-size:1.2rem; }
  .logo b { color:var(--accent); }
  nav { display:flex; gap:8px; align-items:center; }
  nav a { font-weight:700; font-size:.85rem; padding:8px 12px; border-radius:999px; border:1.5px solid var(--line); background:#fff; }
  main { max-width:760px; margin:0 auto; padding:18px 14px 48px; }
  h1 { font-family:Syne,sans-serif; font-size:clamp(1.8rem,5vw,2.6rem); letter-spacing:-1px; margin:8px 0; }
  .lead { color:var(--muted); margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:16px; margin-bottom:12px; animation:in .4s ease both; }
  .card h2 { font-family:Syne,sans-serif; font-size:1.15rem; margin:0 0 4px; }
  .meta { color:var(--muted); font-size:.88rem; }
  .pay { font-family:Syne,sans-serif; font-size:1.3rem; margin:8px 0; }
  button, .btn { font:inherit; font-weight:800; border:none; border-radius:999px; padding:12px 16px; cursor:pointer; background:var(--accent); color:#fff; display:inline-block; }
  .ghost { background:#fff; color:var(--ink); border:1.5px solid var(--line); }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  input { width:100%; padding:12px; border-radius:12px; border:1.5px solid var(--line); font:inherit; font-size:16px; margin-bottom:8px; }
  label { display:block; font-size:.72rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
  .err { color:#b91c1c; min-height:1.2em; font-size:.85rem; }
  @keyframes in { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:none; } }
  @media (max-width:640px) {
    nav a:not(.keep) { display:none; }
    .row button, .row .btn { flex:1 1 140px; text-align:center; }
  }
  @media (prefers-reduced-motion:reduce) { .card { animation:none; } }
</style>
</head>
<body>
<header>
  <a class="logo" href="customer.html">Py<b>Up</b></a>
  <nav>
    <a class="keep" href="courier.html">My route</a>
    <a href="customer.html">Stores</a>
  </nav>
</header>
<main>
  <h1>Jobs waiting for a courier</h1>
  <p class="lead">This board is separate from the route screen. Pick up a delivery, then open the map and ride it to the address.</p>
  <div class="card" id="gate">
    <div id="loginBox">
      <label>Username</label>
      <input id="user" autocomplete="username">
      <label>Password</label>
      <input id="pass" type="password" autocomplete="current-password">
      <p class="err" id="loginErr"></p>
      <button type="button" id="loginBtn">Sign in to see jobs</button>
    </div>
    <div id="board" hidden>
      <label>Name the customer will see</label>
      <input id="rider" placeholder="Your name">
      <div class="row">
        <button type="button" class="ghost" id="sampleBtn">Add a sample job</button>
      </div>
      <p class="err" id="boardErr"></p>
      <div id="list"></div>
    </div>
  </div>
</main>
<script src="config.js"></script>
<script>
const tokenKey = "customerToken";
function headers() {
  return { "Authorization": "Bearer " + localStorage.getItem(tokenKey), "Content-Type": "application/json" };
}
function signedIn() {
  document.getElementById("loginBox").hidden = true;
  document.getElementById("board").hidden = false;
  document.getElementById("rider").value = localStorage.getItem("courierName") || localStorage.getItem("customerName") || "";
  loadJobs();
}
document.getElementById("loginBtn").onclick = async () => {
  const err = document.getElementById("loginErr");
  err.textContent = "";
  const res = await fetch(API + "/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      username: document.getElementById("user").value.trim(),
      password: document.getElementById("pass").value
    })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { err.textContent = typeof data.detail === "string" ? data.detail : "Could not sign in."; return; }
  localStorage.setItem(tokenKey, data.access_token);
  localStorage.setItem("customerName", document.getElementById("user").value.trim());
  signedIn();
};
if (localStorage.getItem(tokenKey)) signedIn();

async function loadJobs() {
  const res = await fetch(API + "/jobs", { headers: headers() });
  const err = document.getElementById("boardErr");
  if (res.status === 401) {
    localStorage.removeItem(tokenKey);
    document.getElementById("loginBox").hidden = false;
    document.getElementById("board").hidden = true;
    return;
  }
  const jobs = await res.json();
  const list = document.getElementById("list");
  if (!jobs.length) {
    list.innerHTML = "<p class='lead'>No open jobs. Add a sample one to show the pickup.</p>";
    return;
  }
  err.textContent = "";
  list.innerHTML = jobs.map(job => `
    <article class="card">
      <h2>${job.service_name || "Order"} · ${job.store_name || ""}</h2>
      <div class="meta">${job.delivery_address || "No address"} · ${job.customer_name || "Guest"}</div>
      <div class="pay">${job.eta_minutes ? job.eta_minutes + " min" : "Soon"}${job.price != null ? " · €" + job.price : ""}</div>
      <div class="row"><button type="button" data-id="${job.id}">Pick up</button></div>
    </article>`).join("");
}
document.getElementById("list").onclick = async (event) => {
  const btn = event.target.closest("[data-id]");
  if (!btn) return;
  const name = document.getElementById("rider").value.trim() || "Courier";
  localStorage.setItem("courierName", name);
  btn.disabled = true;
  const res = await fetch(API + "/orders/" + btn.dataset.id + "/claim", {
    method: "POST",
    headers: headers(),
    body: JSON.stringify({ name })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    document.getElementById("boardErr").textContent = data.detail || "Could not pick that up.";
    btn.disabled = false;
    return;
  }
  location.href = "courier.html?job=" + encodeURIComponent(btn.dataset.id);
};
document.getElementById("sampleBtn").onclick = async () => {
  document.getElementById("boardErr").textContent = "";
  const res = await fetch(API + "/demo-delivery", { method: "POST", headers: headers() });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    document.getElementById("boardErr").textContent = data.detail || "Could not add a sample job.";
    return;
  }
  loadJobs();
};
</script>
</body>
</html>
